<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食见 · 小程序源码本地预览</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #e9edf0; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #182d2a; }
    #preview-shell { width: 100%; max-width: 430px; min-height: 100vh; margin: 0 auto; background: #f4f7f6; --rpx: .52px; position: relative; }
    .preview-caption { background: #e7eeec; color: #5f6f69; font-size: 10px; line-height: 22px; text-align: center; letter-spacing: .3px; }
    .native-navbar { height: 49px; background: #fff; display: flex; justify-content: center; align-items: center; font-size: 17px; font-weight: 600; border-bottom: 1px solid #edf1ef; }
    #mini-page { min-height: calc(100vh - 131px); padding-bottom: 78px; }
    #native-tabs { position: fixed; z-index: 10; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 63px; padding: 5px 0 8px; display: flex; background: #fff; border-top: 1px solid #e4ebe7; }
    #native-tabs button { border: 0; background: transparent; flex: 1; font-family: inherit; font-size: 14px; color: #7b8781; cursor: pointer; padding: 5px 2px; border-radius: 0; margin: 0; line-height: 1.4; }
    #native-tabs button.active { color: #137c5b; font-weight: 600; }
    #preview-toast { display: none; position: fixed; z-index: 1000; bottom: 92px; left: 50%; transform: translateX(-50%); max-width: 330px; width: max-content; padding: 12px 18px; background: rgba(29,42,37,.92); color: #fff; border-radius: 10px; font-size: 14px; }
    #preview-toast.visible { display: block; }
    .preview-dialog-backdrop { position: fixed; inset: 0; z-index: 1200; background: #14282070; display: flex; justify-content: center; align-items: center; padding: 24px; }
    .preview-dialog { width: 100%; max-width: 350px; background: white; border-radius: 16px; padding: 22px; }
    .preview-dialog h2 { font-size: 18px; margin: 0 0 12px; }
    .preview-dialog p { white-space: pre-wrap; font-size: 14px; line-height: 1.7; }
    .preview-dialog textarea { width: 100%; height: 180px; border: 1px solid #ccd9d2; padding: 10px; font-size: 13px; resize: vertical; }
    .preview-dialog button { font: inherit; padding: 10px; border: 0; background: #edf4ef; color: #12734e; border-radius: 7px; margin: 7px 5px 0 0; cursor: pointer; }
    .preview-dialog .action-option { width: 100%; }
    .mini-page button { font-family: inherit; cursor: pointer; }
    .mini-page button::after { border: 0; }
    .mini-page textarea { display: block; font-family: inherit; resize: none; }
    .mini-page img { max-width: 100%; }
  </style>
  <style id="native-styles"></style>
</head>
<body>
  <div id="preview-shell">
    <div class="preview-caption">本地预览 · 非微信开发者工具截图</div>
    <header class="native-navbar" id="native-title">食见 · 食品标签助手</header>
    <main id="mini-page" class="mini-page"></main>
    <nav id="native-tabs" aria-label="页面导航"></nav>
  </div>
  <div id="preview-toast" role="status"></div>
  <script src="/renderer.js"></script>
</body>
</html>
